<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- favicon.png = PNG real para el ícono de pestaña del navegador -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS: app.png para el ícono de pantalla de inicio -->
    <link rel="apple-touch-icon" href="/app.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ahorro IA" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7c3aed" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Todos los descuentos, promos y reintegros de bancos y fintechs de Argentina" />

    <title>Ahorro Inteligente (AI) — Descuentos Argentina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon para todos los navegadores y SO ── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Windows 10 / Edge pinned tiles -->
    <meta name="msapplication-TileImage" content="/app.png" />
    <meta name="msapplication-TileColor" content="#7c3aed" />
    <meta name="msapplication-config" content="none" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS / Apple home screen -->
    <link rel="apple-touch-icon" href="/app.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ahorro IA" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7c3aed" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Todos los descuentos, promos y reintegros de bancos y fintechs de Argentina" />

    <title>Ahorro Inteligente (AI) — Descuentos Argentina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // ── Capturar beforeinstallprompt ANTES de que React monte ──────────────
      // Si el evento llega antes que los componentes React estén listos lo perdemos.
      // Lo guardamos en window.__pwaPrompt para que InstallPrompt lo lea al montar.
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        // Notificar a React si ya está escuchando
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });

      window.addEventListener('appinstalled', function() {
        window.__pwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });

      // ── Service Worker ──────────────────────────────────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
